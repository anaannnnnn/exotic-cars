# Netlify builds this project (website, CRM and the API function) when it is deployed from Git, with
# `netlify deploy --build`, or as the project zip dropped on Netlify Drop while signed in (docs/DEPLOY.md).
# Uploading only the built dist/ folder publishes the static showroom; the CRM and the live data need the function.

[build]
  command = "npm run build"
  publish = "dist"

# Vite 8 needs Node 20.19+ or 22.12+
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The CRM: strict content policy, never framed, never indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "same-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
