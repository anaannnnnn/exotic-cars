<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Model render audit</title>
  <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
  <style>
    body { margin: 0; font: 14px system-ui; background: #111; color: #ddd; }
    #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; }
    iframe { width: 100%; height: 260px; border: 0; background: #222; }
    #log { padding: 8px 12px; white-space: pre-wrap; font: 12px monospace; }
  </style>
</head>
<body>
  <div id="log">idle</div>
  <div id="grid"></div>
  <script>
    /*
     * Loads candidate models in the real Sketchfab viewer and checks that a car actually renders:
     * the viewer becomes ready, it has materials and geometry, and points on the car's flank hit a material.
     * Usage (from the console):  await runAudit(groups, { concurrency: 3 })  -> results in window.__audit
     * groups = [{ key, candidates: [{ uid, ... }] }]; the first candidate that passes wins.
     */
    const log = (m) => { document.getElementById('log').textContent = m; };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    window.__audit = { done: {}, tested: {}, running: 0 };

    function testModel(uid, timeout = 75000) {
      return new Promise((resolve) => {
        const iframe = document.createElement('iframe');
        iframe.allow = 'autoplay; fullscreen';
        document.getElementById('grid').appendChild(iframe);
        const t0 = performance.now();
        let finished = false;
        const done = (r) => { if (finished) return; finished = true; clearTimeout(timer); r.ms = Math.round(performance.now() - t0); setTimeout(() => iframe.remove(), 50); resolve({ uid, ...r }); };
        const timer = setTimeout(() => done({ ok: false, err: 'timeout' }), timeout);
        try {
          new Sketchfab('1.12.1', iframe).init(uid, {
            autostart: 1, preload: 1, dnt: 1, transparent: 1, ui_controls: 0, ui_infos: 0, ui_stop: 0, ui_inspector: 0, ui_settings: 0, ui_help: 0, ui_hint: 0, ui_vr: 0, ui_ar: 0, ui_fullscreen: 0, ui_annotations: 0, ui_animations: 0, ui_watermark_link: 0,
            error: () => done({ ok: false, err: 'init' }),
            success: (api) => {
              api.start();
              api.addEventListener('viewerready', async () => {
                try {
                  await sleep(3500);
                  const mats = await new Promise((r) => api.getMaterialList((e, l) => r(e ? [] : l)));
                  const nodes = await new Promise((r) => api.getNodeMap((e, m) => r(e ? {} : m)));
                  const geo = Object.values(nodes).filter((n) => n.type === 'Geometry' || n.type === 'RigGeometry').length;
                  const w = iframe.clientWidth, h = iframe.clientHeight;
                  let hits = 0;
                  for (const [fx, fy] of [[0.5, 0.5], [0.42, 0.5], [0.58, 0.5], [0.5, 0.42], [0.5, 0.58], [0.35, 0.55], [0.65, 0.55]]) {
                    const r = await new Promise((ok) => { const to = setTimeout(() => ok(null), 1500); try { api.pickFromScreen([Math.round(w * fx), Math.round(h * fy)], (e, x) => { clearTimeout(to); ok(e ? null : x); }); } catch { clearTimeout(to); ok(null); } });
                    if (r && r.material) hits++;
                  }
                  const ok = mats.length >= 2 && geo >= 5 && hits >= 2;
                  done({ ok, mats: mats.length, geo, hits, err: ok ? '' : (hits < 2 ? 'not visible' : mats.length < 2 ? 'few materials' : 'no geometry') });
                } catch (e) { done({ ok: false, err: String(e) }); }
              });
            }
          });
        } catch (e) { done({ ok: false, err: String(e) }); }
      });
    }

    async function runAudit(groups, { concurrency = 3, perGroup = 3 } = {}) {
      const queue = groups.filter((g) => !window.__audit.done[g.key]);
      let finished = 0;
      async function worker() {
        while (queue.length) {
          const g = queue.shift();
          const res = { key: g.key, winner: null, tried: [] };
          for (const c of g.candidates.slice(0, perGroup)) {
            const cached = window.__audit.tested[c.uid];
            const r = cached || (window.__audit.tested[c.uid] = await testModel(c.uid));
            res.tried.push({ uid: c.uid, ok: r.ok, err: r.err, ms: r.ms, mats: r.mats, hits: r.hits });
            if (r.ok) { res.winner = c.uid; break; }
          }
          window.__audit.done[g.key] = res;
          finished++;
          log(`audit ${finished}/${groups.length}  (${Object.keys(window.__audit.tested).length} models loaded)`);
        }
      }
      await Promise.all(Array.from({ length: concurrency }, worker));
      log('audit finished');
      return window.__audit.done;
    }
    window.runAudit = runAudit;
    window.testModel = testModel;
  </script>
</body>
</html>
