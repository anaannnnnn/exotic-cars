<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Exotic Cars Dubai</title>
  <meta name="description" content="Exotic Cars, Dubai – luxury and exotic cars for sale. Explore each car in photos, then configure it in 3D." />
  <meta name="theme-color" content="#f4f1ea" />
  <meta name="color-scheme" content="light dark" />
  <!-- installed to the home screen it opens full screen, like an app -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Exotic Cars" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <!-- the 3D viewer: open the connections early -->
  <link rel="preconnect" href="https://static.sketchfab.com" crossorigin />
  <link rel="preconnect" href="https://sketchfab.com" />
  <link rel="dns-prefetch" href="https://media.sketchfab.com" />
  <!-- the saved (or the device's) theme is applied before the first paint, so a dark visit never flashes light -->
  <script>
    (function () {
      var dark = false, calm = false;
      try { dark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
      try {
        var s = JSON.parse(localStorage.getItem('apex-settings-v1') || 'null');
        if (s && typeof s.dark === 'boolean') dark = s.dark;
        if (s && s.reduceMotion) calm = true;
      } catch (e) {}
      var r = document.documentElement;
      r.dataset.theme = dark ? 'dark' : 'light';
      r.dataset.motion = calm ? 'reduce' : 'full';
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#09090c' : '#f4f1ea');
    })();
  </script>
  <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js" defer></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i class="backdrop__soft"></i><i class="backdrop__a"></i><i class="backdrop__c"></i><i class="backdrop__b"></i><i class="backdrop__dunes"></i><i class="backdrop__floor"></i></div>

  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="fatal" hidden><p id="fatal-text"></p></div>

  <noscript><p style="padding:24px;font:16px system-ui">Exotic Cars needs JavaScript to show the showroom.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
